name: Build Mac Lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check architecture and tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SITECAPTURE_INTEGRATION: "1"
        run: |
          python -c 'import os,platform; assert platform.machine() == os.environ["EXPECTED_ARCH"], platform.machine()'
          python -m unittest discover -s tests -v

      - name: Build app
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name SiteCapture
          --osx-bundle-identifier com.studiomk.sitecapture
          --collect-all playwright
          main.py

      - name: Verify app
        run: |
          test -x dist/SiteCapture.app/Contents/MacOS/SiteCapture
          test -d dist/SiteCapture.app/Contents/Frameworks/playwright/driver
          codesign --verify --deep --strict dist/SiteCapture.app

      - name: Archive
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/SiteCapture.app release/SiteCapture-Mac-Lite-${{ matrix.arch }}.zip
          du -h release/*.zip >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SiteCapture-Mac-Lite-${{ matrix.arch }}
          path: release/*.zip
          retention-days: 14
